# Render Blueprint: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: twilio-dialer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      - key: TWILIO_CALLER_ID
        sync: false
      - key: ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_TEST_NUMBERS
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
